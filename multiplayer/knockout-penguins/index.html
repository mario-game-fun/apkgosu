    <script>
        (function () {
            const pokiBridge = {
                unityObjectName: null,
                sdkPromise: null,
                sendMessage(method, value) {
                    if (!this.unityObjectName) {
                        console.warn('[PokiBridge] Unity object name is not set, cannot send message:', method);
                        return;
                    }

                    const dispatch = () => {
                        if (!ygGameInstance) {
                            console.warn('[PokiBridge] Unity instance is not ready when sending message:', method);
                            return;
                        }

                        try {
                            if (typeof value === 'undefined') {
                                ygGameInstance.SendMessage(this.unityObjectName, method);
                            } else {
                                ygGameInstance.SendMessage(this.unityObjectName, method, value);
                            }
                        } catch (error) {
                            console.error(`[PokiBridge] Failed to send message ${method}`, error);
                        }
                    };

                    if (!ygGameInstance) {
                        const retry = () => {
                            if (ygGameInstance) {
                                dispatch();
                            } else {
                                setTimeout(retry, 50);
                            }
                        };
                        retry();
                    } else {
                        dispatch();
                    }
                },
                ensureSdkInitialized() {
                    if (this.sdkPromise) {
                        return this.sdkPromise;
                    }

                    if (typeof PokiSDK === 'undefined') {
                        console.error('[PokiBridge] PokiSDK script is not available.');
                        return Promise.reject(new Error('PokiSDK not available'));
                    }

                    this.sdkPromise = PokiSDK.init()
                        .then(() => {
                            const adBlocked = typeof PokiSDK.isAdBlocked === 'function' ? PokiSDK.isAdBlocked() : false;
                            this.sendMessage(adBlocked ? 'adblock' : 'ready');
                            return PokiSDK;
                        })
                        .catch((error) => {
                            console.error('[PokiBridge] PokiSDK.init failed', error);
                            const message = (error && error.message ? error.message : String(error || ''));
                            if (message.toLowerCase().includes('adblock')) {
                                this.sendMessage('adblock');
                            } else {
                                this.sendMessage('ready');
                            }
                            return PokiSDK;
                        });

                    return this.sdkPromise;
                }
            };

            function setupApi() {
                window.commercialBreak = function () {
                    return pokiBridge.ensureSdkInitialized()
                        .then(() => PokiSDK.commercialBreak())
                        .then(() => {
                            pokiBridge.sendMessage('commercialBreakCompleted');
                        })
                        .catch((error) => {
                            console.warn('[PokiBridge] commercialBreak error', error);
                            pokiBridge.sendMessage('commercialBreakCompleted');
                        });
                };

                window.rewardedBreak = function (options) {
                    return pokiBridge.ensureSdkInitialized()
                        .then(() => PokiSDK.rewardedBreak(options || {}))
                        .then((withReward) => {
                            pokiBridge.sendMessage('rewardedBreakCompleted', withReward ? 'true' : 'false');
                        })
                        .catch((error) => {
                            console.warn('[PokiBridge] rewardedBreak error', error);
                            pokiBridge.sendMessage('rewardedBreakCompleted', 'false');
                        });
                };

                window.shareableURL = function (params) {
                    return pokiBridge.ensureSdkInitialized()
                        .then(() => PokiSDK.shareableURL(params || {}))
                        .then((url) => {
                            pokiBridge.sendMessage('shareableURLResolved', url || '');
                        })
                        .catch((error) => {
                            console.warn('[PokiBridge] shareableURL error', error);
                            pokiBridge.sendMessage('shareableURLRejected');
                        });
                };

                window.commercialBreakCallBack = function () {
                    pokiBridge.sendMessage('commercialBreakCompleted');
                };
            }

            setupApi();

            window.initPokiBridge = function (instanceName) {
                pokiBridge.unityObjectName = instanceName;
                pokiBridge.ensureSdkInitialized().catch(() => {
                    pokiBridge.sendMessage('ready');
                });
            };
        })();
    </script>

    <style>

            outline: none;
        }

            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;

        }

        #unity-container {

        #unity-canvas {

        #unity-logo {

        }

        #unity-progress-bar-empty {

            font-size: 10px;

            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {

        }

<body class="dark">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="Images/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Additional body modules -->

    <script>
        const hideFullScreenButton = "";
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/Poki.loader.js";
        const config = {
            dataUrl: buildUrl + "/Poki.data.br",
            frameworkUrl: buildUrl + "/Poki.framework.js.br",
            codeUrl: buildUrl + "/Poki.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
            companyName: "Fluffy",
            productName: "Battle Plants",
            productVersion: "0.12"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            //config.devicePixelRatio = 1;
        }

        // The background image when loading the game. When building a build, the code changes depending on the project settings.
        loadingCover.style.background = "url('Images/background.png') center / cover";
        loadingCover.style.display = "";

        let StartUnityInstance;
        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initGame = false;
        let syncInit = false;
        let isVisibility = true;
        let isPausedGame = false;
        const NO_DATA = 'no data';

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));


        window.addEventListener('pointerdown', () => {
            FocusGame();
            SetVisibility(true);
        });

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {
                console.log(err);
            }
        };

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame() {
            if (!isPausedGame) canvas.focus();
        }

        function SetVisibility(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {
                isVisibility = visibility;
                if (!visibility) {
                    YG2Instance('SetFocusWindowGame', 'false');
                }
                else {
                    YG2Instance('SetFocusWindowGame', 'true');
                }
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            YG2Instance('SetPauseGame', 'true');
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            YG2Instance('SetPauseGame', 'false');
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    // Fill Background [Build Modify]
                }).catch((message) => {
                    console.error(message);
                });
            };
            
            InstallBlurFocusBlocker();
            InitYSDK();
            
            if (IsLocalHost() || syncInit)
                StartUnityInstance_IfUnloaded();
        };

        function StartUnityInstance_IfUnloaded() {
            if (spinner.style.display !== "none")
                StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window) {
                    return false;
                }

                const host = window.location.hostname;
                if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
                    LogStyledMessage("Local Host");
                    return true;
                }
            } 
            catch (error) {
                console.error("Error checking the local host:", error);
                return false;
            }
        }

        function YG2Instance(method) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    if (ygGameInstance)
                        ygGameInstance.SendMessage('YG2Instance', method);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method);
            }
                
        }
        function YG2Instance(method, arg) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    ygGameInstance.SendMessage('YG2Instance', method, arg);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method, arg);
            }
        }

        function LogStyledMessage(message, style) {
            console.log('%c' + message, style);
        }
        function LogStyledMessage(message) {
            console.log('%c' + message, 'color: #FFDF73; background-color: #454545');
        }

        async function InitYSDK() {
            try {
                if (IsLocalHost()) return;

                if (typeof YaGames === "undefined") {
                    console.warn('YaGames is not defined. Skipping Yandex SDK initialization.');
                    if (!IsLocalHost() && !syncInit)
                        StartUnityInstance_IfUnloaded();
                    return;
                }

                ysdk = await YaGames.init();
                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);

                // Additional init0 modules

                // Additional init1 modules

                // Additional init2 modules

                // Additional init modules

                initYSDK = true;
                if (ygGameInstance != null)
                    ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');

                LogStyledMessage('Init YandexSDK Success');

            } catch (e) {
                console.error('CRASH Initialization SDK: ', e);
            }

            if (!IsLocalHost() && !syncInit)
                StartUnityInstance_IfUnloaded();
        }

        function InitGame() {
            initGame = true;

            setTimeout(function () {
                if (isPausedGame == true)
                    YG2Instance('SetPauseGame', 'true');
            }, 100);

            // Additional start modules
        }

        // Additional script modules

        document.body.appendChild(script);
    </script>
